<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the phish · Resilience Room</title>
<meta name="description" content="Three e-mails: real or fake? Then report a problem you have run into at school. Student demo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0e14'/%3E%3Cpath d='M16 5l9 3.6v6.2c0 5.6-3.8 10.4-9 12.2-5.2-1.8-9-6.6-9-12.2V8.6z' fill='none' stroke='%234d8eff' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .m { max-width: 520px; margin: 0 auto; padding: 18px 16px 48px; }
  .m header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .m header svg { width: 30px; height: 30px; color: var(--accent); flex: none; }
  .m header b { display: block; font-size: 15px; }
  .m header small { display: block; font-size: 12px; color: var(--muted); }
  .steps-dots { display: flex; gap: 6px; margin-left: auto; }
  .steps-dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--panel-3); }
  .steps-dots i.on { background: var(--accent); }
  h1.big { font-size: 28px; line-height: 1.15; letter-spacing: -0.025em; margin: 10px 0 10px; }
  .intro p { color: var(--ink-2); font-size: 15px; margin-bottom: 22px; }
  .btn { width: 100%; height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 16px; }
  .btn.ghost { background: var(--panel); border: 1px solid var(--line-2); color: var(--ink); }
  .btn:disabled { opacity: 0.5; }
  .mail { border: 1px solid var(--line-2); border-radius: 14px; background: var(--panel); overflow: hidden; margin: 12px 0 16px; }
  .mail .hd { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .mail .from { display: flex; align-items: center; gap: 10px; }
  .mail .av { width: 34px; height: 34px; border-radius: 50%; background: var(--panel-3); display: grid; place-items: center; font-weight: 700; color: var(--ink-2); flex: none; }
  .mail .nm { font-weight: 600; font-size: 14px; }
  .mail .ad { font-family: var(--mono); font-size: 12px; color: var(--ink-2); word-break: break-all; }
  .mail .sj { font-size: 16px; font-weight: 600; margin-top: 12px; }
  .mail .bd { padding: 16px; font-size: 14.5px; color: var(--ink-2); }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice button { height: 56px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 700; font-size: 16px; }
  .choice button:active { transform: scale(0.98); }
  .verdict { border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; border: 1px solid var(--line-2); }
  .verdict.ok { background: color-mix(in srgb, var(--good) 14%, var(--panel)); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
  .verdict.bad { background: color-mix(in srgb, var(--critical) 14%, var(--panel)); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
  .verdict b { font-size: 16px; display: block; margin-bottom: 6px; }
  .verdict ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
  .score { text-align: center; padding: 18px 0 8px; }
  .score .n { font-size: 64px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .score p { color: var(--ink-2); margin-top: 8px; }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opts.three { grid-template-columns: repeat(3, 1fr); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt label { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 52px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-size: 14px; font-weight: 600; }
  .opt label small { font-weight: 400; font-size: 12px; color: var(--ink-2); }
  .opts.three .opt label { text-align: center; align-items: center; }
  .opt input:checked + label { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-wash); }
  .opt input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { width: 100%; min-height: 104px; padding: 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); font-size: 16px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .count { text-align: right; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .err { color: var(--bad-text); font-size: 13.5px; margin-top: 10px; text-align: center; min-height: 1.4em; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; text-align: center; }
  .skip { display: block; margin: 12px auto 0; border: 0; background: none; color: var(--ink-2); font-size: 14px; text-decoration: underline; }
</style>
</head>
<body>
<main class="m">
  <header>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4l10 4v7c0 6.2-4.2 11.5-10 13.5C10.2 26.5 6 21.2 6 15V8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M10.5 16h3l1.8-3.6 2.6 6.4 1.6-2.8h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>Resilience Room</b><small>Student demo · anonymous</small></div>
    <div class="steps-dots" id="dots"></div>
  </header>
  <div id="screen"></div>
</main>

<script src="assets/data.js"></script>
<script>
(function () {
  var CLOUD = { rpc: 'https://fziyuauwrfdmiomwelij.supabase.co/rest/v1/rpc/', key: 'sb_publishable_ADg1MNwF3XHtn0bdRYv8cw_NfdZomZ6' };
  var Q = window.RR.quiz, answers = [], step = 0;
  var AREAS = [
    ['cyber', 'Cyber & data', 'Phishing, passwords, data'],
    ['learning', 'Platform & communication', 'MyHotelschool, messages, login'],
    ['campus', 'Campus & outlets', 'Rooms, kitchens, Wi-Fi'],
    ['people', 'People', 'Staff, cover, wellbeing'],
    ['finance', 'Finance & intake', 'Costs, fees'],
    ['reputation', 'Reputation & trust', 'Trust, reviews, image']
  ];
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rpc(name, body) {
    return fetch(CLOUD.rpc + name, { method: 'POST', headers: { apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) return r.json().then(function (j) { throw new Error(j && j.message || 'Error ' + r.status); }); return r.json(); });
  }
  function dots(n) { var h = ''; for (var i = 0; i < 5; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>'; $('dots').innerHTML = h; }

  function intro() {
    dots(-1);
    $('screen').innerHTML = '<div class="intro"><span class="label">Spot the phish · 30 seconds</span><h1 class="big">Three e-mails. Which ones are fake?</h1>' +
      '<p>These are made-up examples, like the ones that reach students every week. Decide for each one: real or fake. The room’s score appears on the screen in class.</p>' +
      '<button class="btn" id="start">Start</button></div>';
    $('start').onclick = function () { step = 0; answers = []; mail(); };
  }
  function mail() {
    dots(step);
    var m = Q[step];
    $('screen').innerHTML = '<span class="label">E-mail ' + (step + 1) + ' of 3</span>' +
      '<div class="mail"><div class="hd"><div class="from"><span class="av">' + esc(m.from.charAt(0)) + '</span><div><div class="nm">' + esc(m.from) + '</div><div class="ad">' + esc(m.addr) + '</div></div></div>' +
      '<div class="sj">' + esc(m.subject) + '</div></div><div class="bd">' + esc(m.body) + '</div></div>' +
      '<div id="act"><div class="choice"><button data-a="real">Real</button><button data-a="fake">Fake</button></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-a]'), function (b) {
      b.onclick = function () {
        var saysFake = b.dataset.a === 'fake', right = saysFake === m.fake;
        answers.push(right);
        $('act').innerHTML = '<div class="verdict ' + (right ? 'ok' : 'bad') + '"><b>' + (right ? 'Correct: ' : 'Not quite: ') + 'this one is ' + (m.fake ? 'FAKE' : 'REAL') + '</b><ul>' +
          m.flags.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div><button class="btn" id="next">' + (step < 2 ? 'Next e-mail' : 'See my score') + '</button>';
        $('next').onclick = function () { if (step < 2) { step++; mail(); } else result(); };
      };
    });
  }
  function result() {
    dots(3);
    var n = answers.filter(Boolean).length;
    $('screen').innerHTML = '<div class="score"><span class="label">Your score</span><div class="n">' + n + '/3</div><p>' +
      (n === 3 ? 'Sharp. You would have stopped both fakes.' : n === 2 ? 'Close. One message would have got through.' : 'This is exactly why the human factor matters.') + '</p><p class="hint" id="sent">Sending your score to the screen…</p></div>' +
      '<button class="btn" id="go">Report a problem you have had at school</button><button class="skip" id="done">I’m done</button>';
    rpc('resilience_quiz_submit', { p_q1: answers[0], p_q2: answers[1], p_q3: answers[2] })
      .then(function () { $('sent').textContent = 'Your score is on the screen now.'; })
      .catch(function () { $('sent').textContent = 'Could not send your score, but thanks for playing.'; });
    $('go').onclick = form;
    $('done').onclick = thanks;
  }
  function form() {
    dots(4);
    $('screen').innerHTML = '<form id="f" novalidate><span class="label">Report a problem</span><h1 class="big" style="font-size:24px">What has gone wrong for you at school?</h1>' +
      '<fieldset><legend>Which area?</legend><div class="opts">' + AREAS.map(function (a, i) {
        return '<div class="opt"><input type="radio" name="pillar" id="p' + i + '" value="' + a[0] + '"><label for="p' + i + '">' + a[1] + '<small>' + a[2] + '</small></label></div>';
      }).join('') + '</div></fieldset>' +
      '<fieldset><legend>How bad was it?</legend><div class="opts three">' +
        '<div class="opt"><input type="radio" name="sev" id="s1" value="1"><label for="s1">Annoying</label></div>' +
        '<div class="opt"><input type="radio" name="sev" id="s2" value="2" checked><label for="s2">Disruptive</label></div>' +
        '<div class="opt"><input type="radio" name="sev" id="s3" value="3"><label for="s3">Stopped me</label></div></div></fieldset>' +
      '<fieldset><legend><label for="note">What happened?</label></legend><textarea id="note" maxlength="240" placeholder="For example: I missed a deadline change because it was only posted in one section of MyHotelschool"></textarea><div class="count"><span id="cnt">0</span>/240</div></fieldset>' +
      '<button class="btn" id="send" type="submit">Send to the screen</button><p class="err" id="err" role="alert"></p><p class="hint">Anonymous. Please leave out names and personal details.</p></form>';
    var note = $('note');
    note.oninput = function () { $('cnt').textContent = note.value.length; };
    $('f').onsubmit = function (e) {
      e.preventDefault();
      var p = document.querySelector('input[name="pillar"]:checked'), s = document.querySelector('input[name="sev"]:checked');
      if (!p) { $('err').textContent = 'Pick an area first.'; return; }
      if (note.value.trim().length < 3) { $('err').textContent = 'Write a few words about what happened.'; note.focus(); return; }
      var btn = $('send'); btn.disabled = true; btn.textContent = 'Sending…';
      rpc('resilience_report', { p_pillar: p.value, p_campus: 'Both', p_severity: Number(s.value), p_note: note.value.trim() })
        .then(thanks)
        .catch(function (x) { $('err').textContent = 'Could not send: ' + (x.message || x) + '. Try again.'; btn.disabled = false; btn.textContent = 'Send to the screen'; });
    };
  }
  function thanks() {
    $('screen').innerHTML = '<div class="score"><svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="var(--good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>' +
      '<h1 class="big" style="font-size:24px">Thanks. Look at the screen.</h1><p>Your answers are part of the dashboard now.</p></div><button class="btn ghost" id="again">Report another problem</button>';
    $('again').onclick = form;
  }
  intro();
})();
</script>
</body>
</html>
